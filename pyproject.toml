[project]
name = "geoembed"
version = "0.1.0-dev"
description = "Generate vector embeddings from geospatial imagery at scale."
authors = [
    { name = "Jordan Pinder", email = "Jordan.Pinder@communities.gov.uk" },
]
readme = "README.md"
keywords = [
    "geospatial",
    "embeddings",
    "remote-sensing",
    "foundation-models",
    "ray",
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.4",
    "pandas<3.0.0",
    "pyarrow>=14.0.0",
    "pyspark>=4.0.0",
    "databricks-connect==17.3.*",
]

[project.optional-dependencies]
models = ["torch>=2.0", "torchvision>=0.15", "torchgeo>=0.7.1"]
spatial = [
    "rasterio>=1.4.3",
    "geopandas>=1.1.0",
    "shapely>=2.1.0",
    "osbng>=0.5.1",
    "pyproj>=3.7.1",
]
stac = [
    "pystac>=1.13.0",
    "stac-geoparquet>=0.7.0",
    "defusedxml>=0.7.1",
    "pyarrow>=20.0.0",
]
# spark = ["pyspark>=4.0.0", "databricks-connect==17.3.*"]
# gpu = [
#     "cog3pio>=0.1.0; python_version>='3.13'",
# ]
# dali = ["nvidia-dali-cuda120>=1.35.0"]
local = ["rioxarray>=0.19.0", "xarray>=2024.1.0", "dask[complete]>=2025.1.0"]
cog = ["rio-cogeo>=7.0.1", "rasterio>=1.4.3"]
all = ["geoembed[models,spatial,stac,local,cog]"]
# Note: [gpu] (cog3pio) requires Python >=3.13 and CUDA — install separately:
# pip install geoembed[gpu]

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "ruff==0.11.5",
    "pyrefly>=0.61.0",
    "nox>=2025.2.9",
    "pre-commit>=4.0.0",
]
docs = [
    "mkdocs==1.6.*",
    "mkdocs-material==9.7.*",
    "mkdocstrings[python]>=0.25,<1.0",
    "mkdocs-gen-files>=0.5,<1.0",
    "mkdocs-literate-nav>=0.6,<1.0",
]

[project.urls]
Repository = "https://github.com/communitiesuk/geoembed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoembed"]

[tool.ruff]
target-version = "py312"
line-length = 100
fix = true
src = ["src"]

[tool.ruff.lint]
select = [
    "YTT", # flake8-2020
    "S",   # flake8-bandit
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "SIM", # flake8-simplify
    "I",   # isort
    "C90", # mccabe
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "PGH", # pygrep-hooks
    "UP",  # pyupgrade
    "RUF", # ruff
    "TRY", # tryceratops
]
ignore = ["E731", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["geoembed"]

[tool.pyrefly]
project-includes = ["src/geoembed"]
python-version = "3.12"
# Exclude modules requiring optional deps not installed locally
project-excludes = [
    "src/geoembed/gpu/",
    "src/geoembed/io/readers/async_cog_reader.py",
    "src/geoembed/io/readers/gpu_reader.py",
    "src/geoembed/chipping/from_embeddings.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
