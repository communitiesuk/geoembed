repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: "v5.0.0"
  hooks:
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
  - id: check-json
    exclude: ^.devcontainer/devcontainer.json
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-added-large-files
    name: Check for files larger than 7 MB
    args: [ "--maxkb=7000" ]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: "v0.11.5"
  hooks:
  - id: ruff
    args: [ --exit-non-zero-on-fix ]
  - id: ruff-format

- repo: https://github.com/facebook/pyrefly-pre-commit
  rev: 0.61.1
  hooks:
  - id: pyrefly-check
    name: Pyrefly (type checking — informational)
    entry: uv run pyrefly check
    pass_filenames: false
    language: system
    verbose: true
    # Non-blocking: external library stubs (rasterio, pyspark.databricks) produce
    # false positives. All real type errors were fixed; remaining are stub issues.
    always_run: true

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.4.0
  hooks:
    - id: detect-secrets
      name: 'detect-secrets'
      args: ['--exclude-files', '.*\.ipynb$']
